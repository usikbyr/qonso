services:
  qonso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qonso-app
    restart: unless-stopped
    volumes:
      - qonso_data:/app/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Routeur HTTPS (Let's Encrypt)
      - "traefik.http.routers.qonso.rule=Host(`qonso.tensordecision.com`)"
      - "traefik.http.routers.qonso.entrypoints=websecure"
      - "traefik.http.routers.qonso.tls=true"
      - "traefik.http.routers.qonso.tls.certresolver=letsencrypt"
      # Service interne
      - "traefik.http.services.qonso.loadbalancer.server.port=3001"

volumes:
  qonso_data:

networks:
  traefik-public:
    external: true
